# Install after the certificate exists and the reviewed release passes acceptance.
# Preserve the existing public-IP site and SSH-only staging listener.
server {
    listen 80;
    listen [::]:80;
    server_name hub.tfh.org;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://hub.tfh.org$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hub.tfh.org;
    ssl_certificate /etc/letsencrypt/live/hub.tfh.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.tfh.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/tfh-staging/current/Frontend/dist;
    index index.html;
    server_tokens off;
    client_max_body_size 2m;

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
