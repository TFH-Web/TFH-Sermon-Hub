# Certificate bootstrap only; install after the church approves the DNS cutover.
# Add this named host separately from the existing public-IP site.
server {
    listen 80;
    listen [::]:80;
    server_name hub.tfh.org;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
