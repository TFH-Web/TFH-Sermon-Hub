name: Backend Checks
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  PYTHON_VERSION: '3.13'
  POETRY_VIRTUALENVS_IN_PROJECT: 'true'

defaults:
  run:
    working-directory: ./Backend

jobs:
  pytest:
    name: Run pytest tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: Backend/.venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Create test config
        run: |
          cat > tsh/testing.cfg << 'EOF'
          SQLALCHEMY_DATABASE_URI="sqlite:///testing.db"
          JWT_SECRET_KEY="ci-only-dummy-key-not-used-anywhere-real-0000000000000000000000"
          JWT_ACCESS_TOKEN_EXPIRES="timedelta(hours=4)"
          EOF

      - name: Run tests
        env:
          TENANT_ID: "ci-only-dummy-tenant-id"
          CLIENT_ID: "ci-only-dummy-client-id"
        run: poetry run pytest

      - name: Test deployment utilities
        # Deployment utilities deliberately live outside application test collection.
        if: ${{ !cancelled() }}
        run: poetry run pytest -q ../deploy/test_backup.py ../deploy/test_recovery_check.py ../deploy/tests/test_provision_staging.py

      - name: Audit locked backend dependencies
        if: ${{ !cancelled() }}
        run: poetry run pip-audit --format=json --output=pip-audit.json

      - name: Retain backend dependency audit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: backend-dependency-audit
          path: Backend/pip-audit.json
          retention-days: 30
          if-no-files-found: error
