name: Frontend Checks
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

defaults:
  run:
    working-directory: ./Frontend

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - name: Audit locked frontend dependencies
        run: npm audit --audit-level=high --json > npm-audit.json
      - name: Retain frontend dependency audit
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: frontend-dependency-audit
          path: Frontend/npm-audit.json
          if-no-files-found: error
      - name: Build project
        run: npm run build
      - name: Upload production build
        uses: actions/upload-artifact@v6
        with:
          name: Frontend
          path: Frontend/dist/
          if-no-files-found: error

  vite:
    name: Run Vitest tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - name: Run Vitest with production-code coverage
        run: npm run test
      - name: Summarize frontend coverage
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const report = 'coverage/coverage-summary.json';
          if (fs.existsSync(report)) {
            const { total } = JSON.parse(fs.readFileSync(report, 'utf8'));
            const rows = ['lines', 'branches', 'functions', 'statements']
              .map(key => `| ${key} | ${total[key].pct}% | ${total[key].covered}/${total[key].total} |`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '### Frontend production-code coverage\n\n| Metric | Coverage | Covered/total |\n| --- | --- | --- |\n'
              + rows.join('\n') + '\n\nIncludes unimported src files. No team-approved floor is enforced yet.\n');
          }
          JS
      - name: Upload coverage reports
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: vitest-coverage
          path: Frontend/coverage/
          if-no-files-found: error
          retention-days: 30

  playwright:
    name: Run Playwright tests
    needs: build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      # Keep this version equal to @playwright/test in package-lock.json.
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - name: Download production CSS for sidebar regression
        uses: actions/download-artifact@v6
        with:
          name: Frontend
          path: Frontend/dist/
      - name: Run existing mocked feature tests
        run: npm run e2e
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            Frontend/playwright-report/
            Frontend/test-results/
          retention-days: 14

  integration:
    name: Real Flask core-flow smoke test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --ipc=host
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: 'true'
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Poetry
        uses: snok/install-poetry@v1
      - name: Install locked backend dependencies
        working-directory: ./Backend
        run: poetry install --no-interaction --no-root
      - name: Select isolated backend Python
        run: echo "TFH_E2E_PYTHON=$(cd ../Backend && poetry env info --executable)" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Run real-API browser core flow
        run: npm run e2e:integration
      - name: Retain integration failure artifacts
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: real-api-playwright-report
          path: |
            Frontend/playwright-report/integration/
            Frontend/test-results/integration/
          if-no-files-found: error
          retention-days: 14

  biome:
    name: Run Biome checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - name: Run Biome
        run: npx biome ci
